# ---------- SERVER ----------
server.port=8080

# ---------- DATASOURCE / H2 ----------
spring.datasource.url=jdbc:h2:mem:interviewdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# enable H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA / HIBERNATE ----------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- SPRINGDOC / OPENAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Swagger UI url (runtime): http://localhost:8080/swagger-ui.html
spring.security.user.name=interview
spring.security.user.password=interview123
spring.security.user.roles=USER,ADMIN

# ---------- LOGGING ----------
logging.level.org.springframework=INFO
logging.level.com.Semicolon=DEBUG

SIMULATE_EMAIL_BEHAVIOUR=RANDOM

logo.validation.enabled=false

logging.level.org.springframework.security=DEBUG


# ---------- MANAGEMENT (optional) ----------
# if you later add actuator, these endpoints will be exposed
#management.endpoints.web.exposure.include=health,info

#logging.level.org.springframework.security=DEBUG
